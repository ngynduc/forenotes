name: CI

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "$RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix src/client

      - name: Validate Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --no-file-parallelism

      - name: Build application
        run: npm run build
