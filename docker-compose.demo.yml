services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forenotes
      POSTGRES_PASSWORD: forenotes
      POSTGRES_DB: forenotes
    volumes:
      - forenotes_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forenotes -d forenotes"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: forenotes:beta-v1-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      report-llm-service:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://forenotes:forenotes@db:5432/forenotes
      PORT: "3000"
      FORENOTES_DATA_DIR: /app/data
      FORENOTES_DEMO_MODE: "1"
      FORENOTES_SEED_DEV_USERS: "1"
      FORENOTES_ALLOW_HEADER_AUTH: "1"
      SECURE_SESSION_COOKIES: "0"
      LITELLM_SERVICE_URL: http://report-llm-service:8001
    env_file:
      - .env.demo
    ports:
      - "${FORENOTES_DEMO_HOST_PORT:-3000}:3000"
    volumes:
      - forenotes_demo_data:/app/data

  report-llm-service:
    build: ./services/report-llm-service
    restart: unless-stopped

volumes:
  forenotes_demo_pgdata:
  forenotes_demo_data:
