services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forenotes
      POSTGRES_PASSWORD: forenotes
      POSTGRES_DB: forenotes
    volumes:
      - forenotes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forenotes"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      report-llm-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://forenotes:forenotes@db:5432/forenotes
      PORT: "8787"
      FORENOTES_SEED_DEV_USERS: "1"
      LITELLM_SERVICE_URL: http://report-llm-service:8001
    ports:
      - "8787:8787"

  report-llm-service:
    build: ./services/report-llm-service
    restart: unless-stopped

volumes:
  forenotes_pgdata:
